config-version: 5

# 服务器显示名称，可在进服/退服格式中通过 {server} 使用。
serverName: "HuHoBot"

bot:
  app-id: ""
  secret: ""
  name: "HuHoBot"
  groups: []
  # 屏蔽 io.github.kloping.qqbot 直接通过 System.out 输出的调试信息。
  suppress-console-output: true

chat-format:
  from-game: "[游戏] {name}: {message}"
  from-group: "[QQ] {name}: {message}"
  post-chat: true
  # 只有以该内容开头的游戏消息才会转发；转发时会移除该内容。留空表示全部转发。
  start-with: "#"

player-events:
  join:
    enabled: true
    # 可用占位符：{name}、{player}、{server}、{platform}
    format: "[游戏] {name} 加入了服务器"
  quit:
    enabled: true
    # 可用占位符：{name}、{player}、{server}、{platform}
    format: "[游戏] {name} 离开了服务器"

# 配置键对应插件数据目录 Markdown/ 下的文件。
markdown:
  queryOnline: "online.md"

# Hybrid 同时收集命令发送者输出和服务端日志；其他值只收集命令发送者输出。
command-sender: "Hybrid"

motd:
  server-ip: "127.0.0.1"
  server-port: 25565
  api: ""
  text: ""
  post-img: true
  use-markdown: true

whitelist:
  add-command: "whitelist add {name}"
  del-command: "whitelist remove {name}"

filter-regex: []

admin:
  # qq: 仅群主/QQ 群管理员；config: 仅手动名单；both: 任一满足
  mode: both
  openids: []

features:
  full-amount: false

binding:
  # 绑定时是否需要游戏内 /qqbind 验证；关闭时直接绑定无需游戏内操作
  require-game-verification: false

# /执行 命令黑名单：列出禁止通过 /执行 运行的服务器命令（不区分大小写）
# 例如禁止 /执行 op someone：["op", "deop"]
command-blacklist: []

commands:
  查信息: true
  查管理: true
  加管理: true
  删管理: true
  管理方式: true
  添加白名单: true
  删除白名单: true
  查白名单: true
  查在线: true
  在线服务器: true
  发信息: true
  执行命令: true
  执行: true
  管理员执行: true
  全量: true
  认证: true
  解除认证: true
  agent: true

audit:
  # 本地 sensitive-words/*.txt 命中后才调用 OpenAI 兼容接口二审
  # 接口不可用时自动采用本地屏蔽结果
  base-url: ""
  api-key: ""
  model: "gpt-4o-mini"

# AI Agent：管理员 @机器人 /agent <任务描述> 让 AI 管理服务器
# 需要 OpenAI 兼容的 Chat Completions 接口（支持 function calling）
# AI 可调用工具获取插件/命令帮助，并执行服务器命令。
agent:
  enabled: false
  base-url: ""
  api-key: ""
  model: "gpt-4o-mini"
  # auto: 自动执行命令，仅推送思考/输出/工具调用信息
  # manual: 执行命令前需管理员在 QQ 按钮卡片上点击审批（默认）
  command-mode: "manual"

# /执行 <key> [参数]：仅 permission=0
# /管理员执行 <key> [参数]：可执行全部权限等级
# 占位符：{params}、{group}、{user}、{0}、{1}...，并兼容 &1、&2...
custom-commands:
  # - key: "公告"
  #   command: "say {params}"
  #   permission: 1
