# HuHoBot Agent 配置；详细解释与示例见 data/Q&A.txt。
config-version: 19
# 服务器名称显示在查在线图片、入服提示和服务器通知中。支持 MiniMessage（如 <gradient:#22ccee:#aa66ee>名称</gradient>）、§/& 颜色码。请使用单引号包住颜色开头的值。
serverName: 'HuHoBot'
# QQ 机器人帐号与允许工作的群列表。
# ==================== QQ 机器人 ====================
bot:
  # QQ 开放平台机器人 AppID。
  app-id: ''
  # QQ 机器人 Secret，与 AppID 配套使用。
  secret: ''
  # 机器人显示名称。
  name: HuHoBot
  # 机器人监听/发送消息的群 OpenID 列表。
  groups: []
  # 是否过滤 QQ SDK 的控制台噪声日志。
  suppress-console-output: true
  # 新群是否自动加入 bot.groups。
  auto-add-groups: true
# 游戏与 QQ 群之间的聊天格式。
chat-format:
  # 消息格式模板；支持 {name}、{message} 等占位符。
  from-game: '[游戏] {name}: {message}'
  # 消息格式模板；支持 {name}、{message} 等占位符。
  from-group: '[QQ] {name}: {message}'
  # 是否启用本项行为；true 开启，false 关闭。
  post-chat: true
  # 「聊天格式 · 游戏消息触发前缀」设置；按此用途填写，未使用时保持默认值。
  start-with: '#'
  # QQ Markdown 不支持颜色码；开启后转发前去掉 §/& 代码，避免群里出现原始标记。
  strip-colour-codes: true
# 玩家加入、离开和死亡的群播报。
player-events:
  # 「玩家事件通知 · 加入事件」设置；按此用途填写，未使用时保持默认值。
  join:
    # 是否启用「player-events.join」功能。
    enabled: true
    # 消息/输出格式模板。
    format: '[游戏] {name} 加入了服务器'
  # 「玩家事件通知 · 离开事件」设置；按此用途填写，未使用时保持默认值。
  quit:
    # 是否启用「player-events.quit」功能。
    enabled: true
    # 消息/输出格式模板。
    format: '[游戏] {name} 离开了服务器'
  # 「玩家事件通知 · 死亡事件」设置；按此用途填写，未使用时保持默认值。
  death:
    # 是否启用「player-events.death」功能。
    enabled: true
    # 消息/输出格式模板。
    format: '[游戏] {name} {message}'
    # 采用其它死亡信息插件写入事件的文本（它们可用变量自定义）；关闭时使用内置中文描述。
    use-plugin-message: false
# 额外功能开关。
features:
  # 是否启用本项行为；true 开启，false 关闭。
  full-amount: false
# 消息投递策略。
# ==================== 消息投递 ====================
message:
  # 「消息投递 · 消息发送策略」设置；按此用途填写，未使用时保持默认值。
  send-policy: auto
  # 2026-11-17 起，群被动回复有效期为入站后固定 60 分钟；回复不会续期。
  passive-reply:
    # 仅填已确认符合「机器人开发者在本群为群主或管理员」条件的群 OpenID。
    # 这些群每条入站消息最多回复 50 次；未列出的群为 5 次。
    # 不是「机器人账号本身为管理员」；不要凭 bot_state.member_role 推断。
    # QQ 平台最终核验资格，配置不能绕过平台限制。不会向这些群额外发送测试消息。
    enhanced-groups: []
# 黑名单与消息审核策略。
# ==================== 审核与黑名单 ====================
moderation:
  # 列表项按 YAML 列表逐行填写；空列表表示不配置（这是 QQ 成员黑名单，不是违禁词）。
  blacklist: []
  # 是否直接忽略黑名单用户消息。
  block-messages: true
  sensitive-words:
    # 是否调用审核 AI 做二次筛查；失败时回退本地词表，不会单独因网络失败拦截。
    ai-review: false
    # 违规 QQ 入站消息命中后自动尝试撤回；需要机器人具备群管理权限，且平台限制两分钟窗口。
    auto-recall: false
    # 默认关闭。打开后停用内置基础词，只使用 data/sensitive-words/*.txt 中的自定义词。
    # 这不会绕过平台审核、机器人权限或QQ/Minecraft协议；风险由服主承担。
    allow-none: false
    # 违禁词命中后是否发送「你的消息包含违规内容」的拦截提示。
    # false（默认）=只静默撤回，不在群里发提示；true=撤回并 @ 提醒触发者。
    notify-user: false
# 查在线图片、皮肤来源、名称样式及布局。
# ==================== 查在线图片 ====================
online-list:
  # 查在线图片顶部标题；支持 MiniMessage、§ 和 & 颜色码。
  title: '<gradient:#62d6df:#ad9cff>在线列表</gradient>'
  # 是否启用「online-list」功能。
  enabled: true
  # 每页显示的玩家数量。
  page-size: 27
  # 单张图片最多绘制的玩家数；超出名单以文字补充。
  max-render-players: 27
  # 「查在线图片 · 玩家名称显示」设置；按此用途填写，未使用时保持默认值。
  display:
    # 是否显示玩家称号前缀。
    prefix: true
    # 是否显示玩家后缀。
    suffix: true
    # LuckPerms 管理员组名；组内玩家按管理员样式显示。
    admin-groups: []
    # 查在线图片中显示的服务端/核心别名，支持颜色码；留空时自动检测。
    core-name: ''
    # 前缀模板。内置变量：{name} {display} {world} {ping} {server} {online} {max}；也支持 PlaceholderAPI %占位符%。
    prefix-format: ''
    # 后缀模板，内置变量与上相同，也支持 PlaceholderAPI %占位符%。
    suffix-format: ''
  # 「查在线图片 · 管理员权限节点」设置；按此用途填写，未使用时保持默认值。
  admin-permission: ''
  # 同一群连续查询的最短间隔秒数。
  cooldown-seconds: 3
  # 「查在线图片 · 头像皮肤」设置；按此用途填写，未使用时保持默认值。
  skin:
    # 是否加载网络皮肤；关闭后使用内置默认头像。
    enabled: true
    # 离线模式（online-mode=false）下默认只用内置皮肤，不向皮肤站请求贴图；
    # 已安装 SkinsRestorer/ChangeSkin 等皮肤插件时仍会优先显示其皮肤。设为 false 恢复旧行为。
    offline-default-skins: true
    # 单个皮肤请求超时毫秒数；失败会回退，不应设得过大。
    timeout-ms: 5000
    # 头像缓存容量。
    cache-size: 200
    # 皮肤下载并发数；调低可减少低配服务器瞬时网络/CPU负载。
    download-threads: 4
    # 皮肤/头像来源按列表顺序尝试；默认先官方/皮肤站，失败再继续。
    # type 可用 csl/mojang/ely/ashcon/crafatar/avatar；url 支持 {name}、{uuid} 占位符。
    # 私有地址默认拒绝，只有明确可信且确需访问时才配置 allow-private: true。
    sources:
    # LittleSkin CSL；root 是对应皮肤站的纹理根地址。
    - type: csl
      # 该来源的查询 URL。
      url: https://littleskin.cn/csl/{name}.json
      # 皮肤站纹理根 URL。
      root: https://littleskin.cn
    # BlessingSkin/CSL 来源；失败后自动尝试下一项。
    - type: csl
      # 该来源的查询 URL。
      url: https://skin.prinzeugen.net/csl/{name}.json
      # 皮肤站纹理根 URL。
      root: https://skin.prinzeugen.net
    # Mojang 用户名查询；需要再查询官方 session profile。
    - type: mojang
      # 该来源的查询 URL。
      url: https://api.mojang.com/users/profiles/minecraft/{name}
    # Ely.by 纹理档案。
    - type: ely
      # 该来源的查询 URL。
      url: https://skinsystem.ely.by/textures/{name}
    # Ashcon 档案 API。
    - type: ashcon
      # 该来源的查询 URL。
      url: https://api.ashcon.app/mojang/v2/user/{name}
    # Crafatar 头像直链，不再按完整皮肤裁切。
    - type: crafatar
      # 该来源的查询 URL。
      url: https://crafatar.com/avatars/{uuid}?size=64&overlay=true
    # 通用头像直链，作为皮肤来源链的兜底。
    - type: avatar
      # 该来源的查询 URL。
      url: https://mc-heads.net/avatar/{name}/64
  # 查在线图片的最大 PNG 字节数。
  image-max-bytes: 20971520
  # 「查在线图片 · 玩家列数」设置；按此用途填写，未使用时保持默认值。
  columns: 3
  # 图片中展示的服务器地址；留空时不展示，避免意外公开地址。
  address: ''
  # 查在线图片的自定义信息行；空行不占空间，支持 MiniMessage、§ 与 & 颜色码。
  custom-lines: []
  # 图片底部文字。
  footer-text: POWERED BY HuHoBot
# 背包图片渲染与自定义背景。
# ==================== 背包与末影箱图片 ====================
inventory:
  # 「背包图片 · 图片渲染」设置；按此用途填写，未使用时保持默认值。
  render:
    # 「背包图片 · 图片渲染 · 自定义背景」设置；按此用途填写，未使用时保持默认值。
    custom-background:
      # 是否启用「inventory.render.custom-background」功能。
      enabled: false
      # 自定义玩家背包背景文件名，文件放在 data/inventory/backgrounds/。
      inventory-file: inventory.png
      # 自定义末影箱背景文件名；留空时沿用背包背景。
      ender-chest-file: ''
      # 背景适配方式：cover 裁切铺满，stretch 拉伸到画布。
      fit: cover
# 服务器最近公共聊天（图片查询，仅内存，不落盘）。
# ==================== 聊天记录 ====================
chat-log:
  # 是否启用 /聊天记录 与 /玩家聊天 图片命令。
  enabled: true
  # 内存中保留的最大条数（30-5000）。
  keep: 300
  # 每页目标行数（5-100）；超长消息占两行，因此实际条数会减少。
  page-size: 30
  # 单条消息在图片中的最大字符数（20-300），超出部分用省略号。
  max-length: 80
  # 同一群查询冷却秒数（0-60）。
  cooldown-seconds: 3
# 服务器管理 Agent 的模型、权限和上下文设置。
# ==================== AI Agent ====================
agent:
  # 是否启用「agent」功能。
  enabled: false
  # 接口基础地址，通常填写到 /v1。
  base-url: ''
  # Agent 接口密钥。
  api-key: ''
  # 模型名称，需与服务提供方一致。
  model: gpt-4o-mini
  # 每个用户请求允许的模型/工具往返轮数（1..100）；审批或休眠恢复不会重置预算。
  max-steps: 15
  # 单次 sleep 工具允许等待的最长秒数（1..86400）；默认5分钟，可改为7200支持两小时。
  # 等待不占用游戏线程或异步工作线程；重启后不恢复，持久任务用 timed-tasks.yml。
  max-wait-seconds: 300
  # 请求最大生成 token 数；0 表示不发送 max_tokens，使用上游默认值。
  max-tokens: 0
  # 模型请求读超时秒数（30..600），不是任务总时长。
  timeout-seconds: 120
  # 自定义 Agent 身份描述，留空使用默认；工具、权限及当前服务器规则仍会附加。
  system-prompt: ''
  # 「服务器管理 Agent · 命令执行模式」设置；按此用途填写，未使用时保持默认值。
  command-mode: manual
  # 是否启用本项行为；true 开启，false 关闭。
  hide-fetch-results: true
  # 是否启用本项行为；true 开启，false 关闭。
  think: false
  # 「服务器管理 Agent · 思考内容展示位置」设置；按此用途填写，未使用时保持默认值。
  think-visibility: log
  # 「服务器管理 Agent · 思考参数名」设置；按此用途填写，未使用时保持默认值。
  think-param: reasoning_effort
  # 「服务器管理 Agent · 思考等级」设置；按此用途填写，未使用时保持默认值。
  think-level: ''
  # 是否启用本项行为；true 开启，false 关闭。
  think-guide: false
  # Agent 的思考与答复行为提示词。修改前请备份；文本会原样传给模型。
  think-guide-prompt: "你在处理 Minecraft 服务器管理任务。请严格按下面的方式工作：\n\n1. 先在 `[思考]` 与 `[/思考]` 之间完成分析，再输出最终答复。`[思考]`\
    \ 区块内的内容不会展示给用户。\n2. 分析时依次覆盖以下几项，逐条写清结论，不要跳过：\n   - 任务理解：用户真正想达成的最终结果是什么，其中哪些是必须满足的硬性要求，哪些只是偏好。\n\
    \   - 信息盘点：已经掌握的事实（服务器与插件信息、工具返回结果、用户给的数据），以及还缺哪些信息才能动手。\n   - 方案拆解：把任务拆成可执行步骤，写明每一步用哪个工具、参数怎么填；需要执行服务器命令的步骤要写出命令原文。\n\
    \   - 风险校验：命令是否超出你的权限、是否可能误伤玩家或丢失数据、是否命中命令黑名单、执行范围是否过宽。\n   - 自检：结论有没有和已知事实矛盾；数字、坐标、物品 ID、数量、玩家名有没有抄错；方案里的每一步是否都真的调用了工具。\n\
    3. `[思考]` 里不要复述大段工具输出原文，只写判断和结论；分析长度与任务复杂度成正比，简单任务不要长篇大论。\n4. `[/思考]` 之后直接输出给用户看的最终答复：中文、简洁、只讲结果和必要的操作说明，不要出现\"\
    让我想想\"\"首先我需要分析\"这类过程性表述。\n5. 缺少关键信息时不要猜测：说明缺什么、能提供哪些选项，让用户来定。\n"
  # 上下文管理参数：context。
  context:
    # 上下文管理参数：compress。
    compress:
      # 上下文摘要目标长度。
      target: 4000
      # 压缩后保留的最近对话条数。
      keep: 20
      # 上下文压缩提示词。仅影响模型摘要内容，不会删除配置或存档。
      prompt: '你正在为 Minecraft 服务器管理 AI 助手压缩一段对话上下文。压缩后的摘要会**替代**原对话继续工作，因此任何丢失的细节都等于让助手从头再犯一次错。


        请输出一份结构化摘要，严格使用下面这些标题，每个标题下最多 5 条：


        ## 任务目标

        用户最终想达成什么，以及目前已经完成到哪一步。


        ## 关键事实

        从对话和工具结果中已经确认的事实，逐条列出。数字、坐标、物品 ID、数量、玩家名、openid、群号、命令原文必须逐字保留，不要改写、不要换算、不要四舍五入。


        ## 已执行的操作

        已经执行过的服务器命令或改动，以及结果（成功或失败、报错信息要点）。命令用代码格式原样写出。


        ## 决策与理由

        做过的取舍及原因，包括用户明确表达的偏好与禁止事项（例如"不要动某个区块""以后先问再执行"）。


        ## 待办与未解决问题

        还没做的事、需要用户回答的问题、悬而未决的疑点。


        ## 踩过的坑

        失败的尝试、报错信息、被拒绝的操作，以及由此得出的"不要再这么做"的结论。


        ## 实体对照

        openid / member_openid / QQ 昵称 / MC 玩家名 / group_openid 之间的对应关系。


        写作要求：

        - 只写原对话中真实出现过的内容，不要推测、不要补充、不确定的条目直接省略。

        - 面向"接手继续干活的助手"写作，不要写成给人看的汇报。

        - 删掉寒暄、重复确认、致谢等没有信息量的内容。

        - 摘要总长度控制在 {target} token 以内。

        '
    # 上下文管理参数：truncate。
    truncate:
      # 需要裁剪的最旧对话条数。
      drop: 10
  # 工具名白名单，空列表允许全部；例如 [calculate, random_choice, sleep, get_online_list]。
  # 仅允许列表中的工具执行；不要把需要的管理工具漏掉。
  tools: []
  # 长期记忆（AI 可通过工具随时写入/调取，用户可用「记忆」命令分页查看与削减）。
  # 存储在 data/agent-memory/<群>.yml，纯 YAML 文件，适配面板服，无数据库依赖。
  memory:
    # 是否启用长期记忆。
    enabled: true
    # 每个群最多保留的记忆条数（10~2000）。
    max-items: 200
  # 自定义请求头（防套话/网关鉴权等场景）。示例：
  # headers:
  #   X-Custom-Auth: 'your-token'
  #   X-Source: 'Minecraft-Server'
  headers: {}
# 群聊 AI 的模型、触发词、上下文和可用工具。
# ==================== 群聊 AI ====================
chat-ai:
  # 是否启用「chat-ai」功能。
  enabled: false
  # 接口基础地址，通常填写到 /v1。
  base-url: ''
  # 群聊 AI 接口密钥。
  api-key: ''
  # 模型名称，需与服务提供方一致。
  model: gpt-4o-mini
  # 群聊 AI 的触发词。
  trigger: ai
  # 是否启用本项行为；true 开启，false 关闭。
  think: false
  # 「群聊 AI · 思考等级」设置；按此用途填写，未使用时保持默认值。
  think-level: ''
  # 「群聊 AI · 思考参数名」设置；按此用途填写，未使用时保持默认值。
  think-param: reasoning_effort
  # 群聊 AI 的系统提示词。
  system-prompt: ''
  # 本功能允许模型调用的工具列表。
  tools: []
  # 「群聊 AI · 最大上下文消息数」设置；按此用途填写，未使用时保持默认值。
  max-context: 30
  # 上下文管理参数：compress。
  compress:
    # 上下文摘要目标长度。
    target: 4000
    # 压缩后保留的最近对话条数。
    keep: 20
# 语音合成服务及缓存设置。
# ==================== 语音合成 ====================
tts:
  # 是否启用「tts」功能。
  enabled: false
  # 接口基础地址，通常填写到 /v1。
  base-url: https://api.xiaomimimo.com/v1
  # 语音合成服务密钥；留空时 TTS 不会发起请求。
  api-key: ''
  # 服务器对外可访问的公网 URL。
  public-base-url: ''
  # 消息/输出格式模板。
  format: wav
  # 「语音合成 · 预置语音模型」设置；按此用途填写，未使用时保持默认值。
  preset-model: mimo-v2.5-tts
  # 「语音合成 · 自然语音模型」设置；按此用途填写，未使用时保持默认值。
  natural-model: mimo-v2.5-tts-voicedesign
  # 「语音合成 · 克隆语音模型」设置；按此用途填写，未使用时保持默认值。
  clone-model: mimo-v2.5-tts-voiceclone
  # 「语音合成 · 预置音色」设置；按此用途填写，未使用时保持默认值。
  preset-default-voice: mimo_default
  # 「语音合成 · 自然音色描述」设置；按此用途填写，未使用时保持默认值。
  natural-default-voice: 温柔亲切的中文女声
  # 本地克隆音色目录，相对 data/ 目录。
  clone-voices-dir: tts-voices
  # 「语音合成 · 默认克隆音色」设置；按此用途填写，未使用时保持默认值。
  clone-default-voice: ''
  # 每轮最多生成的语音条数。
  max-per-turn: 2
  # 语音上传方式：url=需要配置 public-base-url（推荐）；qq-upload=尝试通过 QQ 上传（暂受限，仍需公网能力）
  upload-mode: url
# AI 联网搜索服务。
# 支持的服务商：none / exa / brave / jina / pmeta / zhipu / doubao / deepseek / custom / js
# 选定具体服务商后只需填写 api-key，url 由插件内置默认值提供；选 custom 可自行填写 url；
# 选 js 可在 search.js-code 中填写完整 JavaScript 代码进行自定义搜索或网页抓取。
search:
  # 搜索服务商：none / exa / brave / jina / pmeta / zhipu / doubao / deepseek / custom / js
  provider: none
  # 搜索服务密钥；留空时搜索功能不可用。
  api-key: ''
  # 自定义模式下的接口 URL（provider=custom 时必填）。
  api-url: ''
  # 最多返回的搜索结果条数（1~10）。
  result-count: 5
  # 是否启用网页抓取（部分服务商支持，如 Exa、Jina、Brave 等）。
  fetch-pages: false
  # JS 自定义搜索代码（provider=js 时使用）。代码中可用全局函数：search(url, options) 发起 HTTP 请求。
  js-code: 
# 敏感词 AI 复核接口；未配置时只使用本地规则。
audit:
  # 接口基础地址，通常填写到 /v1。
  base-url: ''
  # 复核接口密钥（可选）。
  api-key: ''
  # 模型名称，需与服务提供方一致。
  model: gpt-4o-mini
# 插件网络请求的代理设置。
# ==================== 网络 ====================
network:
  # 「网络 · 网络代理」设置；按此用途填写，未使用时保持默认值。
  proxy:
    # 是否启用「network.proxy」功能。
    enabled: false
    # 类型名称，按本配置段说明填写。
    type: http
    # 代理主机名或 IP。
    host: ''
    # 网络端口。
    port: 8080
# 运行状态存储后端；新安装默认 SQLite。
storage:
  # 类型名称，按本配置段说明填写。
  type: sqlite
# 插件消息语言，例如 zh_CN 或 en_US。
language: zh_CN
# 输出额外诊断日志；排障后建议关闭。
debug: false
# WebUI 监听端口。默认只绑定本机回环地址。
webui-port: 5678
# 服务器命令执行方式。
command-sender: Hybrid
# 此处可配置自定义命令映射；未使用时保持 null。
custom-commands: null
# 「command-aliases」设置；按此用途填写，未使用时保持默认值。
command-aliases:
  # 「command-aliases · map」设置；按此用途填写，未使用时保持默认值。
  map: {}
  # 「command-aliases · rename」设置；按此用途填写，未使用时保持默认值。
  rename: {}
# 版本更新提示检查；不控制强制安全更新策略。
update-check:
  # 是否启用「update-check」功能。
  enabled: true
  # 来源地址；仅配置可信的 HTTP(S) 服务。
  url: ''
# PlaceholderAPI 占位符支持。
placeholder-api:
  # 是否启用「placeholder-api」功能。
  enabled: true
# 服务器启停与性能通知。
server-notify:
  # 是否启用「server-notify」功能。
  enabled: true
  # 「服务器状态通知 · 关服通知」设置；按此用途填写，未使用时保持默认值。
  shutdown:
    # 是否启用「server-notify.shutdown」功能。
    enabled: true
    # 发送的提示文字。
    message: 服务器已正常关闭
  # 「服务器状态通知 · 重启通知」设置；按此用途填写，未使用时保持默认值。
  restart:
    # 是否启用「server-notify.restart」功能。
    enabled: true
    # 发送的提示文字。
    message: 服务器已重启完成
  # 「服务器状态通知 · 异常停止通知」设置；按此用途填写，未使用时保持默认值。
  crash:
    # 是否启用「server-notify.crash」功能。
    enabled: true
    # 发送的提示文字。
    message: 服务器意外关闭（崩溃或被强制结束），请管理员检查控制台
  # 时间间隔，单位见配置项名称。
  restart-window: 180
  # 「服务器状态通知 · 性能通知」设置；按此用途填写，未使用时保持默认值。
  performance:
    # 是否向配置群发送持续性能异常/恢复通知。
    enabled: true
    # 连续低于此 TPS 时进入异常判定。
    tps-threshold: 15.0
    # 已用堆内存占最大堆内存的比例阈值，范围 0–1。
    memory-threshold: 0.9
# 新成员入群审批及自动审批策略。
join-approve:
  # 是否启用「join-approve」功能。
  enabled: false
  # 每隔多少秒执行一次。
  interval-seconds: 30
  # 审批策略列表；空列表代表不运行自动审批规则。
  strategies: []

# QQ 绑定、验证及入服限制。
binding:
  # 「玩家绑定与入服验证 · 群成员退群检查」设置；按此用途填写，未使用时保持默认值。
  member-check:
    # 是否启用「binding.member-check」功能。
    enabled: false
    # 检查间隔分钟数。
    interval-minutes: 30
    # 「玩家绑定与入服验证 · 群成员退群检查 · 退群通知」设置；按此用途填写，未使用时保持默认值。
    notify-group: true
  # 「玩家绑定与入服验证 · 单 QQ 绑定上限」设置；按此用途填写，未使用时保持默认值。
  max-bindings: 1
  # 是否启用本项行为；true 开启，false 关闭。
  require-game-verification: true
  # 是否启用本项行为；true 开启，false 关闭。
  force-bind: false
  # 「玩家绑定与入服验证 · 强制绑定群」列表；每项单独占一行。
  force-bind-groups: []
  # 「玩家绑定与入服验证 · 免验证名单」列表；每项单独占一行。
  verify-exempt: []
# 服务器状态查询和 MOTD 输出设置。
motd:
  # 查询服务器地址；不会自动扫描公网 IP。
  server-ip: 127.0.0.1
  # 服务器端口。
  server-port: 25565
  # 外部状态查询 API；留空时使用默认服务。
  api: ''
  # 「服务器状态查询 · text」设置；按此用途填写，未使用时保持默认值。
  text: ''
  # 是否启用本项行为；true 开启，false 关闭。
  post-img: true
  # 是否启用本项行为；true 开启，false 关闭。
  use-markdown: true
# Markdown 模板文件映射。
markdown:
  # 「Markdown 模板 · 在线查询模板」设置；按此用途填写，未使用时保持默认值。
  queryOnline: online.md
# 服务端调度兼容：auto 按运行期类自动判断；hybrid 仅用于同时具备两种调度能力的杂交端。
compatibility:
  # auto / paper / folia / hybrid。plugin.yml 的声明不参与运行判断。
  # folia：区域化调度；paper：传统 Bukkit 调度；hybrid：先区域化，失败才回退。
  server-mode: auto
# 绑定成功或解绑时执行的白名单命令模板。
whitelist:
  # 添加白名单命令模板，可用 {name}。
  add-command: whitelist add {name}
  # 移除白名单命令模板，可用 {name}。
  del-command: whitelist remove {name}
# 需要过滤的正则表达式列表。
filter-regex: []
# 群管理员判断模式与管理员 OpenID。
admin:
  # 「管理员识别 · 管理员判断方式」设置；按此用途填写，未使用时保持默认值。
  mode: both
  # QQ OpenID 列表。
  openids: []
# 禁止 AI 或自定义命令执行的服务器命令。
command-blacklist: []
# QQ 指令面板显示设置。
command-panel:
  # 是否启用本项行为；true 开启，false 关闭。
  show-admin-commands: true
# 各项 QQ 机器人命令的启用状态与面板参数。
commands:
  # 是否启用 QQ「查信息」命令。
  查信息: true
  # 是否启用 QQ「查管理」命令。
  查管理: true
  # 是否启用 QQ「加管理」命令。
  加管理: true
  # 是否启用 QQ「删管理」命令。
  删管理: true
  # 是否启用 QQ「管理方式」命令。
  管理方式: true
  # 是否启用 QQ「添加白名单」命令。
  添加白名单: true
  # 是否启用 QQ「删除白名单」命令。
  删除白名单: true
  # 是否启用 QQ「查白名单」命令。
  查白名单: true
  # 是否启用 QQ「查在线」命令。
  查在线: true
  # 是否启用 QQ「在线服务器」命令。
  在线服务器: true
  # 是否启用 QQ「发信息」命令。
  发信息: true
  # 是否启用 QQ「执行命令」命令。
  执行命令: true
  # 是否启用 QQ「执行」命令。
  执行: true
  # 是否启用 QQ「管理员执行」命令。
  管理员执行: true
  # 是否启用 QQ「全量」命令。
  全量: true
  # 命令「agent」是否启用。
  agent:
    # 是否允许群内调用 Agent 命令。
    enable: true
    # 是否把 Agent 命令放进 QQ 指令面板。
    pushMenu: true
    # QQ 指令面板中的排序优先级，数值越小越靠前。
    priority: 0
  # 是否启用 QQ「我的背包」命令。
  我的背包: true
  # 是否启用 QQ「我的末影箱」命令。
  我的末影箱: true
  # 是否启用 QQ「背包查看」命令。
  背包查看: true
  # 是否启用 QQ「末影箱查看」命令。
  末影箱查看: true
  # 是否启用 QQ「锁定」命令。
  锁定: true
  # 是否启用 QQ「解除锁定」命令。
  解除锁定: true
  # 命令「AI」是否启用。
  AI:
    # 是否允许群聊 AI 命令。
    enable: true
    # 是否把群聊 AI 命令放进 QQ 指令面板。
    pushMenu: true
    # QQ 指令面板中的排序优先级，数值越小越靠前。
    priority: 1
# 跨服务器消息桥开关。
proxy-bridge:
  # 是否启用「proxy-bridge」功能。
  enabled: false
