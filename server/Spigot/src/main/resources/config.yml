config-version: 8

# WebUI 端口，访问 http://127.0.0.1:<port> 管理配置。
webui-port: 5678

# 服务器显示名称，可在进服/退服格式中通过 {server} 使用。
serverName: "HuHoBot"

bot:
  app-id: ""
  secret: ""
  name: "HuHoBot"
  groups: []
  # 屏蔽 io.github.kloping.qqbot 直接通过 System.out 输出的调试信息。
  suppress-console-output: true
  # 收到未配置群的 QQ 消息时，自动把该群 OpenID 追加到上面的 groups。
  auto-add-groups: true

chat-format:
  # 游戏→QQ：{name} 为 MC 玩家名
  from-game: "[游戏] {name}: {message}"
  # QQ→游戏：{name} 为 QQ 用户名（绑定后默认仍是 QQ 名，可用 /MC显示名称 MC 切换）
  # 支持 MiniMessage：<gold>、</gold>、<#FFAA00>、<bold>、<gradient:#FF0000:#00FF00> 等
  # 也兼容旧式颜色码：&6、§6
  from-group: "[QQ] {name}: {message}"
  post-chat: true
  # 只有以该内容开头的游戏消息才会转发；转发时会移除该内容。留空表示全部转发。
  start-with: "#"

player-events:
  join:
    enabled: true
    # 可用占位符：{name}、{player}、{server}、{platform}
    format: "[游戏] {name} 加入了服务器"
  quit:
    enabled: true
    # 可用占位符：{name}、{player}、{server}、{platform}
    format: "[游戏] {name} 离开了服务器"
  death:
    enabled: true
    # 可用占位符：{name}、{player}、{server}、{platform}、{killer}（击杀者）、{message}（中文死亡描述）
    format: "[游戏] {message}"

# 服务器状态通知：关机、重启、意外关闭时提醒 QQ 群。
# 关机通知在服务器停止的瞬间发送；重启与意外关闭只能在下次启动时判断，
# 因此会在机器人连上 QQ 后才发送。
server-notify:
  # 总开关，关闭后下面三项都不发送
  enabled: true
  shutdown:
    enabled: true
    # 可用占位符：{server}、{platform}
    message: "服务器已正常关闭"
  restart:
    enabled: true
    # 可用占位符：{server}、{platform}
    message: "服务器已重启完成"
  crash:
    enabled: true
    # 上次运行没有正常关闭（崩溃、kill -9、断电等）时，下次启动后发送
    # 可用占位符：{server}、{platform}
    message: "服务器意外关闭（崩溃或被强制结束），请管理员检查控制台"
  # 上次正常关闭后多少秒内重新启动算作重启，建议 120-300
  # 超过这个时间再启动只会当作普通开机，不发送通知
  restart-window: 180

# 配置键对应插件数据目录 Markdown/ 下的文件。
markdown:
  queryOnline: "online.md"

# Hybrid 同时收集命令发送者输出和服务端日志；其他值只收集命令发送者输出。
command-sender: "Hybrid"

motd:
  server-ip: "127.0.0.1"
  server-port: 25565
  api: ""
  text: ""
  # 已启用 online-list 时，查在线命令使用本地渲染的在线列表图片，不再使用本节的外部图片接口
  post-img: true
  use-markdown: true

# 查在线命令的本地图片渲染（雾蓝玻璃主题，带玩家皮肤头像）。
# 关闭 enabled 后，查在线会回退到 MOTD 外部 API 图片。
online-list:
  enabled: true
  # 每页玩家数，三列布局推荐 27（3列×9行）
  page-size: 27
  # 管理员置顶；组内按玩家名排序
  admin-first: true
  # 管理员判定权限节点；留空时只看 OP
  admin-permission: ""
  # 同一 QQ 群两次渲染请求的最小间隔秒数，防刷屏
  cooldown-seconds: 3
  skin:
    # 是否下载并显示玩家皮肤头像；关闭则显示占位头像
    enabled: true
    connect-timeout-ms: 3000
    read-timeout-ms: 5000
    # 皮肤头像 LRU 缓存容量
    cache-size: 200
    # 皮肤并发下载线程数（1-12）
    download-threads: 4
  render:
    # 渲染列数（1-3，推荐 3）
    columns: 3
    # 渲染字体；留空自动检测
    font-family: ""
    footer-text: "POWERED BY HuHoBot"
  # 在线列表图片最大字节数，超出则拒绝发送
  image-max-bytes: 20971520

whitelist:
  add-command: "whitelist add {name}"
  del-command: "whitelist remove {name}"

filter-regex: []

admin:
  # qq: 仅群主/QQ 群管理员；config: 仅手动名单；both: 任一满足
  mode: both
  openids: []

features:
  full-amount: false

binding:
  # 绑定时是否需要游戏内 /qqbind 验证；关闭时直接绑定无需游戏内操作
  # 【注意】强制绑定开启时，被踢出的玩家用 5 位验证码直接完成绑定，不经过本流程；
  # 但免验证玩家主动绑定时仍走普通流程，是否需要游戏内 /qqbind 验证由本项决定
  require-game-verification: true
  # 强制绑定：未绑定的玩家进服务器会被踢出，并拿到一个 5 位验证码，
  # 必须在 QQ 群执行 /绑定 <验证码> 完成绑定后才能重新进入。
  # 如果需要开启，一定不要添加任何白名单插件，也不要开启 Minecraft 自带的白名单，
  # 否则未绑定玩家会在白名单阶段先被拦下，拿到不了验证码。
  force-bind: false
  # 强制绑定提示里展示的 QQ 群号，可填多个；留空则不提示具体群号
  force-bind-groups: []
  # 免验证名单：这些玩家无需 QQ 绑定即可进入服务器。
  # 适用于受限于自身设备或环境、无法使用或安装 QQ 的人员，由管理员人工审查后添加。
  verify-exempt: []

inventory:
  render:
    custom-background:
      # 开启后，从 plugins/HuHoBotPenguin/inventory/backgrounds/ 读取本地 PNG。
      enabled: false
      inventory-file: "inventory.png"
      # 留空时末影箱复用 inventory-file。
      ender-chest-file: ""
      # cover：等比裁切填满；stretch：拉伸填满。
      fit: "cover"

# /执行 命令黑名单：列出禁止通过 /执行 运行的服务器命令（不区分大小写）
# 例如禁止 /执行 op someone：["op", "deop"]
# 命名空间前缀与斜杠会被自动忽略：写 "plugins" 同时拦下 "/plugins"、"bukkit:plugins"、
# "minecraft:plugins"；平台能拿到命令表时，别名（如 "pl"）也会一并拦下
command-blacklist: []

command-panel:
  # 仅决定 QQ 客户端是否显示管理员命令；机器人执行时仍检查管理员身份。
  show-admin-commands: true

# 更新检查：启动时后台检查一次，/版本 命令会再检查一次（10 分钟内复用结果）。
# 数据源顺序：update-check.url 自定义地址 → GitHub 代理/CDN 的 version.txt → GitHub Releases。
# 纯文本版本号（如 1.12.0）或 {"version":"1.12.0"} 均可；只认正式版，忽略 Pre-Release。
update-check:
  enabled: true
  # 留空使用内置数据源；可填逗号分隔的多个 URL，例如国内自建接口。
  url: ""

# PlaceholderAPI：安装 PlaceholderAPI 后，配置里的 %占位符% 会交给它解析
# （如 chat-format.from-game: "[%playertitle%] {name}: {message}"）。
# 未安装 PlaceholderAPI 时文本原样保留。默认配置本身不含任何 %占位符%。
placeholder-api:
  enabled: true

commands:
  查信息: true
  查管理: true
  加管理: true
  删管理: true
  管理方式: true
  添加白名单: true
  删除白名单: true
  查白名单: true
  查在线: true
  在线服务器: true
  发信息: true
  执行命令: true
  执行: true
  管理员执行: true
  全量: true
  认证: true
  解除认证: true
  agent:
    enable: true
    pushMenu: true
    priority: 0
  我的背包: true
  我的末影箱: true
  背包查看: true
  末影箱查看: true

audit:
  # 本地 sensitive-words/*.txt 命中后才调用 OpenAI 兼容接口二审
  # 接口不可用时自动采用本地屏蔽结果
  base-url: ""
  api-key: ""
  model: "gpt-4o-mini"

# AI Agent：管理员 @机器人 /agent <任务描述> 让 AI 管理服务器
# 需要 OpenAI 兼容的 Chat Completions 接口（支持 function calling）
# AI 可调用工具获取插件/命令帮助，并执行服务器命令。
agent:
  enabled: false
  base-url: ""
  api-key: ""
  model: "gpt-4o-mini"
  # auto: 自动执行命令，仅推送思考/输出/工具调用信息
  # manual: 执行命令前需管理员在 QQ 按钮卡片上点击审批（默认）
  command-mode: "manual"
  # 开启后，获取插件列表 / 命令帮助 / 服务器日志等结果只交给 AI，不在群里发卡片
  hide-fetch-results: true

  # 深度思考：原生推理模型用，开启后才会向接口附加思考参数（需同时配好 think-level 与 think-param）
  # 与思考引导互斥：开启思考引导后，本项及 think-level / think-param 一律不生效
  think: false
  # 思考过程往哪儿送（与上面的开关相互独立）：
  # log = 只写服务器日志，不在群里发（默认，避免刷屏）
  # group = 作为「思考」卡片发到 QQ 群
  # both = 两边都发
  think-visibility: "log"
  # 传给接口的思考参数名，按厂商选其一：
  # reasoning_effort / effort / thinking_level / reasoning.effort / thinking.type /
  # thinking_budget / enable_thinking
  think-param: "reasoning_effort"
  # 推理设置档位，按模型厂商支持情况填：
  # none / minimal / low / medium / high / xhigh / max
  # 也可填整数 token 预算（如 10000，-1 表示由模型自行决定），或开关值 true / false
  # 留空表示不向接口附加任何思考参数
  think-level: ""
  # 思考引导：非推理模型用，给「不会自己思考」的模型追加提示词，要求它把分析写进 [思考] 标签，
  # 程序再把标签里的内容取出来当思考过程。与深度思考互斥：开启后深度思考相关设置不生效
  think-guide: false
  # 思考引导提示词；留空则使用代码内置默认值
  think-guide-prompt: |
    你在处理 Minecraft 服务器管理任务。请严格按下面的方式工作：

    1. 先在 `[思考]` 与 `[/思考]` 之间完成分析，再输出最终答复。`[思考]` 区块内的内容不会展示给用户。
    2. 分析时依次覆盖以下几项，逐条写清结论，不要跳过：
       - 任务理解：用户真正想达成的最终结果是什么，其中哪些是必须满足的硬性要求，哪些只是偏好。
       - 信息盘点：已经掌握的事实（服务器与插件信息、工具返回结果、用户给的数据），以及还缺哪些信息才能动手。
       - 方案拆解：把任务拆成可执行步骤，写明每一步用哪个工具、参数怎么填；需要执行服务器命令的步骤要写出命令原文。
       - 风险校验：命令是否超出你的权限、是否可能误伤玩家或丢失数据、是否命中命令黑名单、执行范围是否过宽。
       - 自检：结论有没有和已知事实矛盾；数字、坐标、物品 ID、数量、玩家名有没有抄错；方案里的每一步是否都真的调用了工具。
    3. `[思考]` 里不要复述大段工具输出原文，只写判断和结论；分析长度与任务复杂度成正比，简单任务不要长篇大论。
    4. `[/思考]` 之后直接输出给用户看的最终答复：中文、简洁、只讲结果和必要的操作说明，不要出现"让我想想""首先我需要分析"这类过程性表述。
    5. 缺少关键信息时不要猜测：说明缺什么、能提供哪些选项，让用户来定。

  # AI 上下文管理：对话历史按 token 计量，压缩把较早的历史换成摘要，必要时也能直接删最早的消息
  context:
    compress:
      # 压缩后的目标 token 数，同时作为压缩结果的校验上限（群里用 /压缩token 调整）
      target: 4000
      # 压缩时原样保留的最近消息条数（群里用 /压缩保留 调整）
      keep: 20
      # 压缩提示词；{target} 会替换成上面的目标 token 数。留空则使用代码内置默认值
      prompt: |
        你正在为 Minecraft 服务器管理 AI 助手压缩一段对话上下文。压缩后的摘要会**替代**原对话继续工作，因此任何丢失的细节都等于让助手从头再犯一次错。

        请输出一份结构化摘要，严格使用下面这些标题，每个标题下最多 5 条：

        ## 任务目标
        用户最终想达成什么，以及目前已经完成到哪一步。

        ## 关键事实
        从对话和工具结果中已经确认的事实，逐条列出。数字、坐标、物品 ID、数量、玩家名、openid、群号、命令原文必须逐字保留，不要改写、不要换算、不要四舍五入。

        ## 已执行的操作
        已经执行过的服务器命令或改动，以及结果（成功或失败、报错信息要点）。命令用代码格式原样写出。

        ## 决策与理由
        做过的取舍及原因，包括用户明确表达的偏好与禁止事项（例如"不要动某个区块""以后先问再执行"）。

        ## 待办与未解决问题
        还没做的事、需要用户回答的问题、悬而未决的疑点。

        ## 踩过的坑
        失败的尝试、报错信息、被拒绝的操作，以及由此得出的"不要再这么做"的结论。

        ## 实体对照
        openid / member_openid / QQ 昵称 / MC 玩家名 / group_openid 之间的对应关系。

        写作要求：
        - 只写原对话中真实出现过的内容，不要推测、不要补充、不确定的条目直接省略。
        - 面向"接手继续干活的助手"写作，不要写成给人看的汇报。
        - 删掉寒暄、重复确认、致谢等没有信息量的内容。
        - 摘要总长度控制在 {target} token 以内。
    truncate:
      # /删除信息 未指定条数时默认删除的条数
      drop: 10

# /执行 <key> [参数]：仅 permission=0
# /管理员执行 <key> [参数]：可执行全部权限等级
# 占位符：{params}、{group}、{user}、{0}、{1}...，并兼容 &1、&2...
custom-commands:
  # - key: "公告"
  #   command: "say {params}"
  #   permission: 1
