name: HuHoBotPenguin
version: '@version@'

main: agent.spigot.HuHoBotSpigot
api-version: '1.18'
# 内测：默认不声明 Folia 支持；需要时手动改为 true，加载后由运行期检测决定调度方式。
folia-supported: false
foiladebug: false
softdepend: [PlaceholderAPI, ViaVersion, LuckPerms, Vault, TAB, SkinsRestorer, ChangeSkin]

commands:
  huhobot:
    description: HuHoBot control command
    usage: "/huhobot reload|info|password|webui|scripts"
    aliases: [hb]
  at:
    description: Send an @mention message to QQ group
    usage: "/at <nickname> <message>"
    permission: huhobot.command
  qqbind:
    description: Verify QQ binding with a code from the QQ group
    usage: "/qqbind <code>"
    permission: huhobot.qqbind
  send:
    description: Send a message to QQ group
    usage: "/send <message>"
    permission: huhobot.send
permissions:
  huhobot.command:
    description: Allows use of HuHoBot control commands
    default: op
  huhobot.qqbind:
    description: Allows use of QQ bind command
    default: true
  huhobot.send:
    description: Allows use of send command to QQ group
    default: true
